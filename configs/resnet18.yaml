# Starting configuration, not optimized hyperparameters.
# No YAML loader/training loop exists yet. Pass model settings explicitly to
# build_resnet18; data/preprocessing/training settings are integration contracts.
seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_manifest: data/splits/train.csv
  validation_manifest: data/splits/validation.csv
  test_manifest: data/splits/test.csv
  class_mapping: data/splits/identity_to_class.json
  split_ratios: [0.70, 0.15, 0.15]
  num_workers: 0
preprocessing:
  image_size: [128, 128]
  color_mode: RGB
  # Apply once in the data pipeline, after converting RGB pixels to [0, 1].
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  crop_policy: pre_cropped_face
  alignment: none
training:
  batch_size: 32
  epochs: 15  # Initial head-only baseline; excludes future fine-tuning.
  optimizer: AdamW
  weight_decay: 0.0001
  loss: cross_entropy
  checkpoint_dir: checkpoints/resnet18
  selection_metric: validation_loss
  head_training:
    epochs: 15
    freeze_backbone: true
    learning_rate: 0.001
  fine_tuning:
    # Future separate experiment; no fine-tuning epoch budget chosen yet.
    epochs: null
    unfreeze_layers: [layer4]
    backbone_learning_rate: 0.0001
    head_learning_rate: 0.0001
    # Frozen blocks automatically retain evaluation-mode BatchNorm statistics.
model:
  name: resnet18
  num_classes: null  # Use the same mapping as the custom CNN.
  pretrained: true
  trainable_backbone: "none"  # Later: "layer4" or "all".
  pretrained_weights: DEFAULT  # ResNet18_Weights.DEFAULT; explicit build may download.
  replace_classifier_head: true
