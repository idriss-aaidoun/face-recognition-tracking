# Starting configuration, not optimized hyperparameters.
# Pass num_classes and dropout to build_custom_cnn explicitly; no YAML loader
# connects these fields yet. Training fields describe the future shared loop.
seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_manifest: data/splits/train.csv
  validation_manifest: data/splits/validation.csv
  test_manifest: data/splits/test.csv
  class_mapping: data/splits/identity_to_class.json
  split_ratios: [0.70, 0.15, 0.15]
  num_workers: 0
preprocessing:
  image_size: [128, 128]
  color_mode: RGB
  # Match ResNet18: normalize once after converting RGB pixels to [0, 1].
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  crop_policy: pre_cropped_face
  alignment: none
training:
  batch_size: 32
  epochs: 15  # Match the initial ResNet18 head-only baseline budget.
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: cross_entropy
  checkpoint_dir: checkpoints/custom_cnn
  selection_metric: validation_loss
model:
  name: custom_cnn
  num_classes: null  # Derive from the audited identity mapping.
  pretrained: false
  dropout: 0.3
